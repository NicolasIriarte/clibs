name: CI

on:
  push:
    branches: [main]
    # A tag is what publishes a release; the release job below waits on the test job even for a tag.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Everything below runs with only apt and this repository -- no other network fetch, since this
  # runner's CI network does not have open internet access (a plain `curl` to an arbitrary host is
  # refused). `just` stays a local-development convenience; CI runs the same commands directly instead
  # of fetching it.
  test:
    runs-on: ubuntu-latest
    # A passing run takes well under a minute; the limit is so that a step that hangs fails the job
    # rather than holding the runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install a C compiler and a shell linter
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential shellcheck

      # Every shell file this repository ships or releases with. Listed rather than globbed: none of them
      # has an extension to glob on.
      - name: Lint the shell scripts
        run: |
          shellcheck -x bash-logger/logger.bashrc bash-logger/examples/minimal.sh \
            bash/cap_output bash/changelog_section bash/check_versions bash/tests/run \
            testing/gen_test_registry logger/tests/run bash-logger/tests/run testing/tests/run

      - name: Check the tooling in bash/, without a tag involved
        run: bash/tests/run

      - name: Build and run every library's example
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          cc -std=c11 -Wall -Wextra -Werror -Ilogger logger/examples/minimal.c -o "$work/logger"
          "$work/logger" >/dev/null 2>&1
          echo "ok   logger"
          logger/tests/run >/dev/null
          echo "ok   logger (output checks)"

          bash bash-logger/examples/minimal.sh >/dev/null 2>&1
          echo "ok   bash-logger"
          bash-logger/tests/run >/dev/null
          echo "ok   bash-logger (output checks)"

          make -C testing EXAMPLE=minimal run >/dev/null
          echo "ok   testing"

          make -C testing EXAMPLE=production run >/dev/null
          echo "ok   testing (production example)"

          testing/tests/run >/dev/null
          echo "ok   testing (runner checks)"

          make -C testing clean >/dev/null

      - name: Check packaging, without a tag involved
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          for lib in logger bash-logger testing; do
            tar --transform "s,^$lib,$lib-v9.9.9," --transform "s,^LICENSE,$lib-v9.9.9/LICENSE," \
              -czf "$work/$lib-v9.9.9.tar.gz" "$lib" LICENSE

            listing="$(tar -tzf "$work/$lib-v9.9.9.tar.gz")"
            echo "$listing" | grep -qx "$lib-v9.9.9/LICENSE" \
              || { echo "$lib-v9.9.9.tar.gz is missing its LICENSE"; exit 1; }
            echo "$listing" | grep -qx "$lib-v9.9.9/README.md" \
              || { echo "$lib-v9.9.9.tar.gz is missing its README"; exit 1; }
            echo "$listing" | grep -q "$lib-v9.9.9/examples/" \
              || { echo "$lib-v9.9.9.tar.gz is missing its examples/"; exit 1; }

            echo "ok   $lib-v9.9.9.tar.gz"
          done

      # The same examples again, built to trip on what a plain build lets through: a read past the end of
      # a buffer or an overflowing shift only fails an ordinary run if it happens to crash it. Leak
      # detection is off because the suite never frees its bookkeeping, on purpose, and because the leak
      # checker needs ptrace, which a CI container does not always grant.
      #
      # Non-PIE, because AddressSanitizer in this image's gcc 12 fails at random on a kernel that
      # randomises addresses over 32 bits, which this runner's does: wherever a position-independent
      # executable lands, the shadow memory can collide with it, and the program prints
      # AddressSanitizer:DEADLYSIGNAL in a loop without ever reaching main -- about one start in four,
      # of any sanitized binary however trivial. A fixed load address takes the collision away. Each run
      # is still under `timeout` and bash/cap_output, so that anything of the kind fails within seconds
      # and a few hundred lines, rather than holding the runner and filling its log.
      - name: Build and run the examples under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          SANITIZED: >-
            -std=c11 -Wall -Wextra -Werror -g -fsanitize=address,undefined
            -fno-sanitize-recover=undefined -fno-pie -no-pie
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # bounded <command...>: at most two minutes and 2,000 lines, where a passing run takes a
          # second and prints under a hundred.
          bounded() { bash/cap_output 2000 timeout 120 "$@" >/dev/null; }

          cc $SANITIZED -Ilogger logger/examples/minimal.c -o "$work/logger"
          bounded "$work/logger"
          echo "ok   logger"

          make -C testing clean >/dev/null
          bounded make -C testing CFLAGS="$SANITIZED" EXAMPLE=minimal run
          echo "ok   testing"

          bounded make -C testing CFLAGS="$SANITIZED" EXAMPLE=production run
          echo "ok   testing (production example)"

          make -C testing clean >/dev/null

  # Publishes the release a tag names: one tarball per library, and the changelog's own words about it.
  release:
    needs: [test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 curl ca-certificates

      # Before packaging anything: a tag whose version was never written down should fail here rather
      # than publish a release with an empty page, which nobody will go back and fix.
      #
      # The tag reaches every step below through the environment rather than being pasted into the
      # script: a tag name is text someone typed, and text pasted into a shell script is run as one.
      - name: The changelog has something to say about this version
        env:
          TAG: ${{ github.ref_name }}
        run: bash/changelog_section "$TAG" > /tmp/release-notes.md

      # A tarball that reports a different version from the tag it was published under misleads whoever
      # drops it into a project, so a version left unbumped fails here rather than being released.
      - name: The libraries report the version being tagged
        env:
          TAG: ${{ github.ref_name }}
        run: bash/check_versions "$TAG"

      # Each tarball packs one library directory and nothing else from the root, so the repository's
      # LICENSE is added to it by name.
      - name: Package every library
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for lib in logger bash-logger testing; do
            tar --transform "s,^$lib,$lib-$TAG," --transform "s,^LICENSE,$lib-$TAG/LICENSE," \
              -czf "dist/$lib-$TAG.tar.gz" "$lib" LICENSE
            echo "wrote dist/$lib-$TAG.tar.gz"
          done

      - name: Publish the release
        env:
          # Forgejo provides GITHUB_TOKEN for checkout; whether it may create a release depends on the
          # instance. CLIBS_RELEASE_TOKEN overrides it where it may not -- set it in the repository's
          # Actions secrets if this step is refused.
          TOKEN: ${{ secrets.CLIBS_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"

          # The body is the changelog's section, JSON-encoded by python rather than by hand: release
          # notes are prose with quotes and newlines in them, and a hand-rolled escape gets that wrong
          # exactly once and then publishes something unreadable.
          body="$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": open("/tmp/release-notes.md").read()}))' "$TAG")"

          id="$(printf '%s' "$body" \
            | curl -sf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
                   --data @- "$api/releases" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          echo "Created release $TAG (id $id). Attaching:"
          for file in dist/*; do
            echo "  $(basename "$file")"
            curl -sf -X POST -H "Authorization: token $TOKEN" \
                 -F "attachment=@${file}" \
                 "$api/releases/${id}/assets?name=$(basename "$file")" > /dev/null
          done
